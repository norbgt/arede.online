name: Mapa base (Brasil)

# 27/11/2026 (Amanda aprovou): o mapa da rede é servido pela própria rede (Storage do Supabase, balde "mapas"),
# sem custo e sem mandar dado de quem usa a outro serviço (Privacidade não muda).
# Recorta o Brasil do mapa aberto da Protomaps (dados OpenStreetMap, licença ODbL) com o programa oficial,
# divide em partes de 32 MiB, publica por alguns minutos aqui no GitHub só para o Supabase buscar
# (função mapa-copia, que só aceita esta origem) e apaga a publicação no fim.
# Roda quando mapa-base/pedido.txt muda (atualizar o mapa = mudar a data escrita lá).
on:
  push:
    branches: [main]
    paths: ["mapa-base/pedido.txt"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mapa-base
  cancel-in-progress: false

jobs:
  recorte:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      FUNCAO: https://zbmzabgdejylpmabujad.supabase.co/functions/v1/mapa-copia
    steps:
      - uses: actions/checkout@v4
      - name: Programa oficial pmtiles (protomaps/go-pmtiles)
        run: |
          gh release download --repo protomaps/go-pmtiles --pattern '*Linux_x86_64.tar.gz' --output p.tgz
          tar xzf p.tgz pmtiles
          ./pmtiles version || true
      - name: Recorte do Brasil (até o nível de rua)
        run: |
          KEY=$(curl -fsSL https://build-metadata.protomaps.dev/builds.json | jq -r 'map(.key) | sort | last')
          BUILD=${KEY%.pmtiles}
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          ./pmtiles extract "https://build.protomaps.com/$KEY" brasil.pmtiles --bbox=-74.1,-33.9,-32.3,5.4 --maxzoom=15
          ls -la brasil.pmtiles
      - name: Partes de 32 MiB
        run: |
          mkdir partes
          split -b 33554432 -d -a 4 brasil.pmtiles partes/p
          N=$(ls partes | wc -l)
          T=$(stat -c %s brasil.pmtiles)
          echo "{\"build\":\"$BUILD\",\"parte\":33554432,\"partes\":$N,\"tamanho\":$T,\"maxzoom\":15,\"criado\":\"$(date -u +%FT%TZ)\"}" > partes/manifesto.json
          cat partes/manifesto.json
      - name: Publicação temporária
        run: |
          gh release create "mapa-$BUILD" partes/* --title "Mapa base $BUILD (temporário)" --notes "Temporário, o Supabase copia as partes e esta publicação é apagada em seguida." --prerelease
      - name: Supabase copia as partes
        run: |
          for f in $(ls partes | grep '^p'); do
            ok=0
            for t in 1 2 3 4 5; do
              if curl -fsS -X POST "$FUNCAO" -H 'content-type: application/json' -d "{\"tag\":\"mapa-$BUILD\",\"nome\":\"$f\"}"; then ok=1; echo; break; fi
              sleep $((t*15))
            done
            [ $ok = 1 ] || { echo "falhou $f"; exit 1; }
          done
          curl -fsS -X POST "$FUNCAO" -H 'content-type: application/json' -d "{\"tag\":\"mapa-$BUILD\",\"nome\":\"manifesto.json\"}"
      - name: Apaga a publicação temporária
        if: always()
        run: |
          [ -n "$BUILD" ] && gh release delete "mapa-$BUILD" --cleanup-tag -y || true
